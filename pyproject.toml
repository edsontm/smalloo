[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smalloo-ramfd-water-knn"
version = "0.1.0"
description = "RAMFD + water-color KNN-like filtering experiment packaged for pip installs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "Pillow",
  "PyYAML",
  "imageio",
  "opencv-python-headless",
  "bayesian-optimization",
]

[project.scripts]
smalloo-ramfd-water-knn = "smalloo_ramfd_water_knn.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["smalloo_ramfd_water_knn*", "src*", "scripts*"]
